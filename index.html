  /* ---- Colour palettes. A palette tints only three things: --bg2 (the top of the
     page gradient), --line (every border, including the card borders) and --amber
     (the accent). Card/panel backgrounds come from --surface, which is mode-level,
     so cards stay black in dark mode and white in light mode in every theme. The
     status colours (--go/--gold/--red/--blue) and the per-muscle-group accents are
     fixed on purpose. "default" has no block — it is the base. ---- */

  html[data-palette="monolith"][data-theme="dark"]{ --amber:#C9CDD4; --line:#2E3034; --bg2:#1A1C1F; }
  html[data-palette="monolith"][data-theme="light"]{ --amber:#3D4348; --line:#D6D8DC; --bg2:#E4E6E9; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    font-variant-numeric:tabular-nums; padding-bottom:calc(84px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased;}
  /* The page gradient. Fixed to the viewport rather than painted on <body> so the
     tint sits at the top of the screen no matter how long the page is or how far
     it's scrolled. background-attachment:fixed is unreliable in iOS Safari; a fixed
     pseudo-element at z-index:-1 is not. Top-to-bottom (not radial) so every pixel
     of the top row is exactly --bg2 and the sticky header can match it. */
  body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:linear-gradient(180deg, var(--bg2) 0%, var(--bg) 55%, var(--bg) 100%);}
  .brand,.daytitle .grp,.daytitle .date,.today-btn,.chip .d,.chip .g,.sec-h .lbl,.badge,.setlbl,.stepper input,.stepper .unit,.ring,.ring .cnt,h1.viewh,nav.tabs button,.btn,.ex-name,.skillhead .sn,.skillhead .ss,ol.ladder li .num,.hrow .hd,.hrow .hm,.restcard b{font-family:var(--display); letter-spacing:.02em;}
  h1.viewh,.daytitle .grp,.brand .wm,.ring .cnt,.restcard b{letter-spacing:.05em;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}
  header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--bg2) 72%,rgba(0,0,0,0)); padding:calc(env(safe-area-inset-top) + 12px) 0 8px;}
  .topline{display:flex; align-items:center; justify-content:space-between; padding:0 16px;}
  .brand{display:flex; flex-direction:column; align-items:flex-start; line-height:1;}
  .brand .wm{font-weight:800; letter-spacing:.22em; font-size:15px; text-transform:uppercase; color:var(--muted);}
  .brand .wm b{color:var(--amber);}
  .brand .acr{font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:3px; font-weight:700;}
  .ring{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);}
  .ring .cnt{font-weight:800; color:var(--ink); font-size:14px;}
  .daynav{display:flex; align-items:center; gap:10px; padding:10px 16px 4px;}
  .daynav button.nav{background:var(--surface); border:1px solid var(--line); color:var(--ink); width:38px; height:38px; border-radius:10px; font-size:18px; flex:0 0 auto;}
  .daytitle{flex:1; text-align:center;}
  .daytitle .grp{font-size:22px; font-weight:800; letter-spacing:.02em; line-height:1.1;}
  .daytitle .date{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-top:2px;}
  .today-btn{font-size:11px; color:var(--amber); background:none; border:none; padding:4px 2px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;}
  .railwrap{padding-top:2px;}
  .weeklbl{text-align:center; font-family:var(--display); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding:2px 0 4px;}
  .rail{display:flex; gap:6px; padding:6px 16px 6px; overflow-x:hidden; scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .chip{flex:1 1 0; min-width:0; height:58px; perspective:520px; background:none; border:none; padding:0; color:var(--muted);}
  .ci{position:relative; width:100%; height:100%; transform-style:preserve-3d;}
  .chip.flip .ci{transform:rotateY(180deg); animation:chipflip .5s cubic-bezier(.2,.7,.2,1);}
  .chip.unflip .ci{animation:chipunflip .5s cubic-bezier(.2,.7,.2,1);}
  @keyframes chipflip{from{transform:rotateY(0);}to{transform:rotateY(180deg);}}
  @keyframes chipunflip{from{transform:rotateY(180deg);}to{transform:rotateY(0);}}
  .rail.slide-prev{animation:railPrev .32s ease;}
  .rail.slide-next{animation:railNext .32s ease;}
  @keyframes railPrev{from{transform:translateX(-30px);opacity:.2;}to{transform:translateX(0);opacity:1;}}
  @keyframes railNext{from{transform:translateX(30px);opacity:.2;}to{transform:translateX(0);opacity:1;}}
  .cf,.cb{position:absolute; inset:0; border-radius:10px; -webkit-backface-visibility:hidden; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--line); background:var(--surface); overflow:hidden;}
  .cf .d{font-size:10px; letter-spacing:.06em; text-transform:uppercase;}
  .cf .g{font-size:9px; margin-top:3px; font-weight:700; color:var(--faint); line-height:1; max-width:42px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cb{transform:rotateY(180deg); background:var(--amber); color:var(--onacc); font-size:20px;}
  .chip.sel .cf{border-color:currentColor; border-width:2px;}
  .chip.sel .cf .d{color:var(--ink);}
  .chip.skill .cf{border-style:double; border-width:3px; border-color:var(--skill);}
  .chip.logged .cf::after{content:"•"; position:absolute; bottom:4px; font-size:13px; line-height:0; color:var(--muted);}
  .chip.complete .cf{border-color:var(--gold); box-shadow:0 0 9px rgba(233,194,74,.8), inset 0 0 5px rgba(233,194,74,.35);}
  .chip.complete .cf .g{color:var(--gold);}
  .chip.ovcomplete .cf{border-style:solid; border-color:var(--skill); box-shadow:0 0 9px rgba(197,139,224,.85), inset 0 0 5px rgba(197,139,224,.35);}
  .chip.ovcomplete .cf .g{color:var(--skill);}
  .chip.rest .cf{border-color:var(--blue); box-shadow:0 0 7px rgba(111,166,216,.55), inset 0 0 4px rgba(111,166,216,.22);}
  .chip.rest .cf .g{color:var(--blue);}
  .chip.skip .cf{border-style:dashed; border-color:var(--chest); opacity:.55;}
  .chip.skip .cf .d,.chip.skip .cf .g{color:var(--chest); text-decoration:line-through;}
  .chip.skip .cf::before{content:""; position:absolute; top:50%; left:-2px; right:-2px; height:2px; background:var(--chest); transform:rotate(-24deg); opacity:.8;}
  .chip.manual .cf{border-style:dashed; border-color:var(--amber);}
  .chip.manual .cf .g{color:var(--amber);}
  /* edit bar */
  .editbar{display:flex; align-items:center; gap:6px; padding:8px 16px 4px; flex-wrap:wrap;}
  .editbar .eb-day{font-family:var(--display); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:2px;}
  .editbar button{font-family:var(--display); font-size:11px; font-weight:600; letter-spacing:.04em; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink);}
  .editbar button.on{border-color:var(--amber); color:var(--amber);}
  /* skip + manual bodies */
  .skipcard{background:var(--surface); border:1px dashed var(--chest); border-radius:var(--r); padding:20px; text-align:center; color:var(--muted); font-size:14px; line-height:1.5;}
  .skipcard b{color:var(--chest); display:block; font-size:18px; margin-bottom:6px; font-family:var(--display); letter-spacing:.04em;}
  .mname{flex:1; min-width:0; background:var(--surface2); border:1px solid var(--line); border-radius:8px; color:var(--ink); font-family:var(--display); font-weight:700; font-size:15px; padding:9px 10px;}
  .mname:focus{outline:none; border-color:var(--amber);}
  .minidel{flex:0 0 auto; width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--faint); font-size:14px; margin-left:8px;}
  .mkindrow{display:flex; gap:6px; margin-top:10px;}
  .mkindrow button{flex:1; padding:7px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); font-family:var(--display); font-size:12px; font-weight:600; letter-spacing:.05em;}
  .mkindrow button.on{border-color:var(--amber); color:var(--amber);}
  .msetctrl{display:flex; gap:8px; margin-top:10px;}
  .msetctrl button{flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-family:var(--display); font-size:12px; font-weight:600;}
  .addex{width:100%; padding:14px; border-radius:12px; border:1px dashed var(--amber); background:transparent; color:var(--amber); font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:.06em; margin-bottom:10px;}
  .mhint{font-size:12px; color:var(--faint); text-align:center; line-height:1.5; padding:0 8px 8px;}
  main{padding-top:6px;}
  .sec-h{display:flex; align-items:center; gap:10px; margin:22px 4px 10px;}
  .sec-h .lbl{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .sec-h .rule{flex:1; height:1px; background:var(--line);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:12px;}
  .card.ready{border-color:var(--go);}
  .ex-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .ex-name{font-size:16px; font-weight:700; line-height:1.25;}
  .ex-head{display:flex; align-items:center; gap:8px;}
  .ex-head .chev{color:var(--faint); font-size:12px; flex:0 0 auto;}
  .ex-target{font-size:12px; color:var(--muted); margin-top:3px;}
  .badge{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 7px; border-radius:6px; background:var(--surface2); color:var(--muted); white-space:nowrap;}
  .ex-note{font-size:12px; color:var(--faint); margin-top:6px; font-style:italic;}
  .formpanel{margin-top:10px; padding:10px 12px; background:var(--surface2); border-radius:10px; font-size:13px; line-height:1.5; color:var(--ink); display:none;}
  .formpanel.open{display:block;}
  .formpanel .k{display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:4px;}
  .fp-blk{margin-bottom:12px;}
  .fp-blk:last-child{margin-bottom:0;}
  .lvladj{display:flex; gap:8px; margin-top:8px;}
  .lvladj button{flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:var(--display); font-size:12px; font-weight:600; letter-spacing:.04em;}
  .ex-lvl{font-family:var(--display); font-size:11px; letter-spacing:.03em; color:var(--amber); margin-top:4px; font-weight:600;}
  .badge.lvb{background:transparent; border:1px solid var(--amber); color:var(--amber);}
  .fp-lvl{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); color:var(--amber); font-size:12px; line-height:1.45;}
  .card-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
  .foot-next{flex:1; min-width:0; font-size:12px; line-height:1.4; color:var(--muted);}
  .foot-next b{display:block; font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:9px; color:var(--faint); margin-bottom:2px;}
  .lvlup-btn{flex:0 0 auto; font-family:var(--display); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; padding:9px 14px; border-radius:9px; border:1px solid var(--amber); color:var(--amber); background:transparent;}
  .lvlup-btn.ready{background:var(--go); border-color:var(--go); color:#14110F;}
  .lvlup-btn.max{border-color:var(--line); color:var(--faint); opacity:.7;}
  .lvlup-btn.arm{background:var(--gold); border-color:var(--gold); color:#14110F;}
  .btn.arm{border-color:var(--gold); color:var(--gold);}
  .lvlup-btn:active{opacity:.6;}
  .sets{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .setrow{display:flex; align-items:center; gap:6px;}
  .setlbl{width:40px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; flex:0 0 auto;}
  .sethead{margin-bottom:2px;}
  .sethead .sh{flex:1; min-width:0; text-align:center; font-family:var(--display); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);}
  .sethead .shpad{flex:0 0 auto; width:42px;}
  .stepper{display:flex; align-items:center; background:var(--surface2); border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:1; min-width:0;}
  .stepper button{background:none; border:none; color:var(--ink); height:42px; font-size:19px; padding:0; flex:0 1 34px; width:34px; min-width:27px;}
  .stepper button:active{background:var(--line);}
  .stepper input{text-align:center; background:none; border:none; color:var(--ink); font-size:16px; font-weight:700; height:42px; padding:0; flex:1 1 44px; min-width:38px; width:38px;}
  .stepper input:focus{outline:none;}
  .stepper .unit{font-size:10px; color:var(--muted); padding-right:10px; text-transform:uppercase; letter-spacing:.05em; flex:0 0 auto;}
  .logtoggle{flex:0 0 auto; width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--faint); font-size:18px; font-weight:700;}
  .logtoggle.on{background:var(--amber); color:var(--onacc); border-color:var(--amber);}
  /* --go is a fixed mid-tone green in both modes, so dark text always reads on it —
     pin it rather than inheriting --onacc, which flips to white in light mode. */
  .card.ready .logtoggle.on{background:var(--go); border-color:var(--go); color:#14110F;}
  .cue{margin-top:12px; font-size:12px; line-height:1.45; color:var(--muted); display:flex; gap:8px; align-items:flex-start;}
  .cue .k{color:var(--faint); text-transform:uppercase; letter-spacing:.08em; font-size:10px; font-weight:700; padding-top:1px; flex:0 0 auto;}
  .levelup{margin-top:12px; padding:10px 12px; background:rgba(123,201,111,.1); border:1px solid var(--go); border-radius:10px; font-size:13px; color:var(--go); font-weight:600; line-height:1.4;}
  .restcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; text-align:center; color:var(--muted); font-size:14px; line-height:1.5;}
  .restcard b{color:var(--ink); display:block; font-size:18px; margin-bottom:6px; letter-spacing:.02em;}
  .hrow{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
  .hrow .hh{display:flex; justify-content:space-between; align-items:center;}
  .hrow .hd{font-weight:700; font-size:15px;}
  .hrow .hm{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  .hrow .hstat{font-size:12px; color:var(--muted); margin-top:6px;}
  .hdetail{margin-top:10px; border-top:1px solid var(--line); padding-top:10px; display:none;}
  .hdetail.open{display:block;}
  .hex{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--ink);}
  .hex .v{color:var(--muted);}
  /* Empty states fill the remaining screen instead of sitting as a short stub in a
     tall blank area. dvh so it tracks Safari's collapsing toolbar; the plain vh line
     first is the fallback for anything that doesn't know dvh. */
  .empty{text-align:center; color:var(--faint); padding:40px 20px; font-size:14px; line-height:1.5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:calc(100vh - 260px); min-height:calc(100dvh - 260px);}
  .set-item{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px;}
  .set-item label{font-size:13px; color:var(--muted); display:block; margin-bottom:10px; letter-spacing:.02em;}
  .set-item .capnote{font-size:12px; color:var(--faint); margin-top:10px; line-height:1.5;}
  .progbtn{text-align:left; line-height:1.3;}
  .progbtn .pg{display:block; font-size:11px; color:var(--muted); font-family:-apple-system,system-ui,sans-serif; font-weight:400; letter-spacing:0; margin-top:2px;}
  .lvb-btn{cursor:pointer; border:1px solid var(--line);}
  .lvb-btn.open{border-color:var(--amber); color:var(--amber);}
  .lvlmenu{margin:10px 0 2px; border:1px solid var(--line); border-radius:10px; background:var(--surface2); overflow:hidden;}
  .lvlmenu-h{font-family:var(--display); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:10px 12px 6px;}
  .lvlopt{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; padding:10px 12px; background:none; border:none; border-top:1px solid var(--line); color:var(--ink); font-size:13px; line-height:1.4;}
  .lvlopt .ln{flex:0 0 20px; height:20px; border-radius:6px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .lvlopt .lt{flex:1;}
  .lvlopt .lnow{font-size:10px; color:var(--amber); text-transform:uppercase; letter-spacing:.1em; align-self:center;}
  .lvlopt.cur{background:rgba(214,158,46,.08);}
  .lvlopt.cur .ln{border-color:var(--amber); color:var(--amber);}
  .ladder li.tapl{cursor:pointer;}
  .gcat{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; background:var(--surface2);}
  .gcat-h{display:flex; align-items:center; gap:10px; padding:12px 13px; cursor:pointer;}
  .gcat-n{flex:1; font-family:var(--display); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink);}
  .gcat-c{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .gcat-b{max-height:0; overflow:hidden; transition:max-height .22s ease;}
  .gcat-b.open{max-height:700px;}
  .gcat-b .gearwrap{padding:2px 13px 13px;}
  .gearwrap{display:flex; flex-wrap:wrap; gap:8px;}
  .gearchip{font-family:var(--display); font-size:12px; font-weight:600; letter-spacing:.03em; padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface2); color:var(--muted);}
  .gearchip.on{border-color:var(--go); color:var(--go); background:rgba(123,201,111,.1);}
  .palgrid{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  /* .palchip is specifically the palette swatch chip; .optchip is the same look for
     any other small option row. Keep them separate so "how many palettes are shown"
     stays an unambiguous question. */
  .palchip,.optchip{display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); font-family:var(--display); font-size:12px; font-weight:600; letter-spacing:.03em;}
  .palchip .sw{width:14px; height:14px; border-radius:50%; flex:0 0 auto; border:1px solid var(--line);}
  .palchip.on,.optchip.on{border-color:var(--amber); color:var(--amber);}
  /* first-run wizard */
  .wiz{padding-top:calc(env(safe-area-inset-top) + 22px); padding-bottom:32px;}
  .wizhero{text-align:center; margin-bottom:20px;}
  .wizhero .rtitle{font-family:var(--display); font-weight:700; font-size:46px; letter-spacing:.24em; text-indent:.24em; color:var(--ink); line-height:.9;}
  .wizhero .rtitle b{color:var(--amber);}
  .wizhero .racr{font-family:var(--display); font-weight:500; font-size:9px; letter-spacing:.3em; text-indent:.3em; text-transform:uppercase; color:var(--faint); margin-top:9px;}
  .wizsteps{display:flex; gap:6px; justify-content:center; margin:0 0 18px;}
  .wizdot{width:30px; height:4px; border-radius:2px; background:var(--line);}
  .wizdot.on{background:var(--amber);}
  .wiznav{display:flex; gap:8px; margin-top:6px;}
  html[data-wiz="on"] nav.tabs{display:none;}
  html[data-wiz="on"] body{padding-bottom:24px;}
  /* rest timer — lives OUTSIDE #app so ticking it never triggers a full render() */
  .restbar{position:fixed; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom)); z-index:29;
    margin:0 12px; border-radius:12px; border:1px solid var(--amber); background:var(--barbg);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding:10px 12px;
    display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .restbar[hidden]{display:none;}
  .restbar .rb-t{flex:0 0 auto; width:54px; text-align:center; font-family:var(--display); font-weight:700; font-size:21px; color:var(--amber); font-variant-numeric:tabular-nums; line-height:1;}
  .restbar .rb-m{flex:1; min-width:0;}
  .restbar .rb-l{font-family:var(--display); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .restbar .rb-n{font-size:12px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
  .restbar .rb-trk{height:4px; border-radius:3px; background:var(--surface2); margin-top:6px; overflow:hidden;}
  .restbar .rb-fill{height:100%; background:var(--amber); border-radius:3px;}
  .restbar button{flex:0 0 auto; width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); font-family:var(--display); font-size:11px; font-weight:700; padding:0;}
  .restbar.done{border-color:var(--go);}
  .restbar.done .rb-t{color:var(--go); font-size:17px;}
  .restbar.done .rb-fill{background:var(--go);}

  html[data-anim="off"] *, html[data-anim="off"] *::before, html[data-anim="off"] *::after{transition:none!important; animation:none!important;}

function skillIdsFor(dow){

/* ============ Rest timer ============
   Foreground-only by design: iOS suspends background timers, and an offline web app
   cannot schedule a real notification (that needs a live server pushing to the
   device). So this is a visible countdown plus an optional beep, nothing more.
   The bar sits outside #app and is updated directly rather than through render(),
   because render() rebuilds all of #app and would fight the number inputs every
   second. End time is stored absolutely, so backgrounding and returning self-corrects
   instead of drifting. */
const REST_OPTS=[[0,"Off"],[60,"60s"],[90,"90s"],[120,"2 min"],[180,"3 min"]];
let _restEnd=0,_restTotal=0,_restName="",_restTick=null,_restOsc=[],_actx=null;
const restEl=()=>document.getElementById("restbar");
function beepIn(delaySec){
  /* Scheduled ahead of time, inside the tap that started the timer — the gesture is
     what unlocks the AudioContext on iOS, so scheduling now is far more reliable
     than trying to start a sound when the countdown hits zero. */
  if(store.restBeep===false)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    if(!_actx)_actx=new AC();
    if(_actx.state==="suspended")_actx.resume();
    [0,0.28].forEach(off=>{
      const t=_actx.currentTime+Math.max(0,delaySec)+off;
      const o=_actx.createOscillator(),g=_actx.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.22,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.connect(g); g.connect(_actx.destination);
      o.start(t); o.stop(t+.26); _restOsc.push(o);
    });
  }catch(e){}
}
function cancelBeeps(){_restOsc.forEach(o=>{try{o.stop();}catch(e){}});_restOsc=[];}
function restStart(name){
  const sec=Number(store.restSec||0); if(!sec)return;
  cancelBeeps();
  _restTotal=sec; _restEnd=Date.now()+sec*1000; _restName=name||"";
  beepIn(sec);
  if(_restTick)clearInterval(_restTick);
  _restTick=setInterval(paintRest,250);
  paintRest();
}
function restStop(){
  cancelBeeps();
  if(_restTick){clearInterval(_restTick);_restTick=null;}
  _restEnd=0; const el=restEl(); if(el){el.hidden=true;el.classList.remove("done");}
}
function restAdjust(delta){
  if(!_restEnd)return;
  const left=Math.max(0,_restEnd-Date.now())/1000, next=Math.max(5,left+delta);
  cancelBeeps();
  _restTotal=Math.max(_restTotal,Math.ceil(next));
  _restEnd=Date.now()+next*1000;
  beepIn(next); paintRest();
}
function paintRest(){
  const el=restEl(); if(!el)return;
  if(!_restEnd){el.hidden=true;return;}
  const leftMs=_restEnd-Date.now(), left=Math.ceil(leftMs/1000);
  if(leftMs<=-4000){restStop();return;}                       /* linger, then clear */
  const done=leftMs<=0;
  el.hidden=false; el.classList.toggle("done",done);
  const mm=Math.floor(Math.max(0,left)/60),ss=Math.max(0,left)%60;
  const pct=done?100:Math.min(100,Math.max(0,(1-leftMs/(_restTotal*1000))*100));
  el.innerHTML=`<div class="rb-t">${done?"GO":mm+":"+String(ss).padStart(2,"0")}</div>
    <div class="rb-m"><div class="rb-l">${done?"Rest complete":"Resting"}</div>
      <div class="rb-n">${_restName||"Next set"}</div>
      <div class="rb-trk"><div class="rb-fill" style="width:${pct.toFixed(1)}%"></div></div></div>
    <button data-r="minus">−15</button><button data-r="plus">+15</button><button data-r="stop">✕</button>`;
}

    const ov=store.overrides[state.dateISO];
    const it=ov&&ov.items&&ov.items.find(x=>x.key===id);

function scrollToNextEx(id){

  if(i<0||i+1>=cards.length)return;
  const hdr=document.querySelector("header");

      <div class="stepper"><button id="bwdec">−</button><input id="bw" inputmode="numeric" value="${store.bodyweight||175}"><span class="unit">lb</span><button id="bwinc">+</button></div>
      <div class="capnote">Ruck cap ~<b>${cap}lb</b> (⅓ bodyweight). Start at 20lb regardless and build slowly.</div></div>`:""}
    <div class="set-item"><label>Mode</label><div class="btnrow">${modeBtnsHTML()}</div>
      <div class="capnote">The app runs dark by default. Every colour theme below has both a dark and a light version, so this switch and the theme are independent.</div></div>
    <div class="set-item"><label>Colour theme</label>
      <div class="palgrid">${palChips}</div>
      <div class="capnote">Themes tint the <b>page gradient</b>, the <b>card borders</b> and the accent. Card backgrounds stay black in dark mode and white in light mode. The status colours stay put on purpose — <span style="color:var(--go)">done</span>, <span style="color:var(--blue)">rest</span>, <span style="color:var(--red)">skip</span> and the per-muscle day colours mean the same thing in every theme.</div></div>
    <div class="set-item"><label>Animations</label><div class="btnrow">
      <button class="btn" style="margin-top:0; ${on(store.anim!==false)}" data-a="anim" data-v="on">On</button>
      <button class="btn" style="margin-top:0; ${on(store.anim===false)}" data-a="anim" data-v="off">Off</button></div>
      <div class="capnote">Overrides your phone's Reduce Motion setting — animations play unless you switch them off here.</div></div>
    <div class="set-item"><label>Rest timer</label>
      <div class="palgrid">${REST_OPTS.map(([v,t])=>`<button class="optchip ${Number(store.restSec||0)===v?"on":""}" data-a="restsec" data-v="${v}">${t}</button>`).join("")}</div>
      <div class="btnrow" style="margin-top:10px">
        <button class="btn" style="margin-top:0; ${on(store.restBeep!==false)}" data-a="restbeep" data-v="on">Beep on</button>
        <button class="btn" style="margin-top:0; ${on(store.restBeep===false)}" data-a="restbeep" data-v="off">Silent</button></div>
      <div class="capnote">Ticking a set starts a countdown in a bar above the tabs, with ±15s and a dismiss. It runs <b>only while RAID is open</b> — iOS suspends timers once you switch apps, and an offline web app can't schedule a real notification (that needs a live server, which this deliberately isn't). For a nudge when the app is closed, set a repeating iOS Reminder or a Shortcuts "Time of Day" automation.</div></div>
    <div class="set-item"><label>Data</label><button class="btn" data-a="export">Copy my data (backup)</button>
      ${state.expMsg?`<div class="capnote" style="margin-top:6px; color:${state.expMsg==="ok"?"var(--go)":"var(--red)"}">${state.expMsg==="ok"?"Backup copied to clipboard — paste it somewhere safe.":"Copy failed — the clipboard is blocked here. Try again, or screenshot your data as a last resort."}</div>`:""}
      <button class="btn" data-a="restoretoggle">Restore from a backup</button>
      ${state.showRestore?`<textarea id="impdata" class="impbox" placeholder="Paste your copied backup here…"></textarea><button class="btn" id="imp">Load this backup</button><div class="capnote" id="impmsg" style="margin-top:6px"></div>`:""}
      <button class="btn ${state.armErase?"arm":"warn"}" data-a="erase">${state.armErase?"Tap again to erase everything":"Erase all logs"}</button>
      ${state.armErase?`<div class="capnote" style="margin-top:6px; color:var(--gold)">This clears every logged session and every skip/manual day. Your program, gear, skill steps and exercise levels stay. Tap again to confirm, or wait 4s to cancel.</div>`:""}
      <div class="capnote">Stored only on this phone — nothing leaves the device, and it isn't synced between devices or people. Copy a backup now and then; paste it into Restore to move to a new phone or recover after clearing Safari data. Restoring <b>replaces</b> everything currently in the app.</div></div>
    <div class="set-item"><label>About</label><div class="capnote">Seven selectable programs, gear/location filtering, and an emphasis lean. Home Recomp is the flagship (skills, ruck, level ladders). Tap ⓘ on any exercise for gear + form. Display font: Rajdhani (OFL).</div></div>
  </div>`;
  const bw=document.getElementById("bw");
  if(bw){bw.addEventListener("change",e=>{store.bodyweight=clamp(parseInt(e.target.value)||175,80,500);save();render();});
    document.getElementById("bwdec").onclick=()=>{store.bodyweight=clamp((store.bodyweight||175)-5,80,500);save();render();};
    document.getElementById("bwinc").onclick=()=>{store.bodyweight=clamp((store.bodyweight||175)+5,80,500);save();render();};}
  const impBtn=document.getElementById("imp");
  if(impBtn)impBtn.onclick=()=>{const el=document.getElementById("impdata"),msg=document.getElementById("impmsg");const raw=((el&&el.value)||"").trim();
    if(!raw){if(msg){msg.textContent="Paste a backup first.";msg.style.color="var(--red)";}return;}
    let r;try{r=JSON.parse(raw);}catch(e){if(msg){msg.textContent="That isn't valid backup text — copy the whole thing and try again.";msg.style.color="var(--red)";}return;}
    if(!r||typeof r!=="object"||!r.logs){if(msg){msg.textContent="That doesn't look like a RAID backup.";msg.style.color="var(--red)";}return;}
    store=hydrate(r);applyProgram();applyTheme();save();state.showRestore=false;state.expMsg=null;render();};
}

/* ============ Events ============ */
/* Actions that write to store.logs[state.dateISO] — these stamp which program
   the session was trained under. Keep in sync when adding log-mutating actions. */
const LOG_ACTS={inc:1,dec:1,done:1,ruckdone:1,madd:1,mdel:1,mkind:1,msetadd:1,msetdel:1,skadv:1,skback:1};
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(LOG_ACTS[a])stampProgram(state.dateISO);
  if(a==="homeflip"){const now=Date.now(); if(now-_homeTap<330){state.homeFlip=!state.homeFlip;_homeTap=0;return render();} _homeTap=now; return;}
  if(a==="homeflipbtn"){state.homeFlip=!state.homeFlip;return render();}
  if(a==="calprev"||a==="calnext"){const an=state.calAnchor?parseISO(state.calAnchor):new Date();state.calAnchor=iso(new Date(an.getFullYear(),an.getMonth()+(a==="calnext"?1:-1),1));return render();}
  if(a==="goto"){state.tab=b.dataset.tab;state.openSkill=null;state.editDay=null;return render();}
  if(a==="prev"){state.dateISO=addDays(state.dateISO,-1);state.railBase=null;state.editDay=null;return render();}
  if(a==="next"){state.dateISO=addDays(state.dateISO,1);state.railBase=null;state.editDay=null;return render();}
  if(a==="today"){state.dateISO=todayISO();state.railBase=null;state.editDay=null;return render();}
  if(a==="pick"){if(Date.now()-_swipeTap<400)return; const d=b.dataset.d; if(d===state.dateISO){ if(state.editDay===d){state.editDay=null;state.unflipDay=d;} else {state.editDay=d;} } else {if(state.editDay)state.unflipDay=state.editDay; state.dateISO=d;state.editDay=null;} return render();}
  if(a==="ovset"){const d=state.dateISO,t=b.dataset.t; const cur=ovOf(d);
    if(cur&&cur.type===t){delete store.overrides[d];} else if(t==="skip"){store.overrides[d]={type:"skip"};} else {store.overrides[d]={type:"manual",items:(cur&&cur.items)||[]};}
    state.unflipDay=state.editDay; state.editDay=null; save(); return render();}
  if(a==="ovclear"){state.unflipDay=state.editDay; delete store.overrides[state.dateISO];state.editDay=null;save();return render();}
  if(a==="editclose"){state.unflipDay=state.editDay; state.editDay=null;return render();}
  if(a==="madd"){const d=state.dateISO,ov=store.overrides[d]||(store.overrides[d]={type:"manual",items:[]}); if(ov.type!=="manual"){store.overrides[d]={type:"manual",items:[]};}
    const items=store.overrides[d].items; const key="man_"+Date.now().toString(36); items.push({key,name:"",kind:"weight"}); dayLog(d)[key]={sets:Array.from({length:3},()=>({v:10,w:0,done:false}))}; save(); return render();}
  if(a==="mdel"){const d=state.dateISO,ov=store.overrides[d]; if(ov&&ov.items){ov.items=ov.items.filter(x=>x.key!==b.dataset.key);} const dl=dayLog(d); delete dl[b.dataset.key]; save(); return render();}
  if(a==="mkind"){const ov=store.overrides[state.dateISO]; const it=ov&&ov.items&&ov.items.find(x=>x.key===b.dataset.key); if(it){it.kind=b.dataset.k;} save(); return render();}
  if(a==="msetadd"||a==="msetdel"){const dl=dayLog(state.dateISO),e=dl[b.dataset.key]; if(e&&e.sets){ if(a==="msetadd")e.sets.push({v:10,w:0,done:false}); else if(e.sets.length>1)e.sets.pop(); } save(); return render();}
  if(a==="form"){const p=b.closest(".card").querySelector(".formpanel");if(p)p.classList.toggle("open");return;}
  if(a==="inc"||a==="dec"){const step=parseInt(b.dataset.step||"1"),delta=a==="inc"?step:-step,id=b.dataset.id,f=b.dataset.f,i=b.dataset.i,dl=dayLog(state.dateISO);
    if(!dl[id]){ if(id.startsWith("sk_"))skLog(id.slice(3),state.dateISO); }
    if(i!==undefined){const s=dl[id].sets[+i];s[f]=Math.max(0,(Number(s[f])||0)+delta);}else{dl[id][f]=Math.max(0,(Number(dl[id][f])||0)+delta);}
    save();return render();}
  if(a==="done"){
    const id=b.dataset.id,dl=dayLog(state.dateISO),s=dl[id].sets[+b.dataset.i];
    const checking=!s.done;                                   /* unticking must not start a rest */
    s.done=!s.done; save();
    const nowComplete=checking&&dl[id].sets.every(x=>x.done);
    if(checking)restStart(exDisplayName(id));
    render();
    if(nowComplete)scrollToNextEx(id);
    return;}
  if(a==="ruckdone"){const dl=dayLog(state.dateISO);dl[b.dataset.id].done=!dl[b.dataset.id].done;save();return render();}
  if(a==="skadv"||a==="skback"){const id=b.dataset.id,max=SKILLS[id].steps.length;store.skillSteps[id]=clamp((store.skillSteps[id]||1)+(a==="skadv"?1:-1),1,max);
    const dl=dayLog(state.dateISO),k="sk_"+id;if(dl[k]&&dl[k].rounds===0){dl[k].step=store.skillSteps[id];dl[k].result=SKILLS[id].steps[store.skillSteps[id]-1].def;}save();return render();}
  if(a==="lvlpick"){const id=b.dataset.id; state.lvlPick=state.lvlPick===id?null:id; state.armLevel=null; return render();}
  if(a==="lvlset"){const id=b.dataset.id, ex=findEx(id); if(!ex||!ex.lv)return; const n=clamp(parseInt(b.dataset.n)||0,0,ex.lv.length-1);
    store.exLevels[id]=n; state.lvlPick=null; state.armLevel=null; save(); return render();}
  if(a==="exlvlup"){const id=b.dataset.id, ex=findEx(id); if(!ex||!ex.lv)return; const max=ex.lv.length-1, cur=clamp(store.exLevels[id]||0,0,max); if(cur>=max)return;
    if(b.dataset.noconf){store.exLevels[id]=cur+1;save();return render();}
    if(state.armLevel!==id){ state.armLevel=id; if(_armTimer)clearTimeout(_armTimer); _armTimer=setTimeout(()=>{state.armLevel=null;render();},4000); return render(); }
    state.armLevel=null; if(_armTimer)clearTimeout(_armTimer); store.exLevels[id]=cur+1; save(); return render();}
  if(a==="exlvldown"){const id=b.dataset.id, ex=findEx(id); if(!ex||!ex.lv)return; const cur=clamp(store.exLevels[id]||0,0,ex.lv.length-1); if(cur<=0)return; state.armLevel=null; store.exLevels[id]=cur-1; save(); return render();}
  if(a==="skilldays"){store.skillDays=parseInt(b.dataset.n); save(); return render();}
  if(a==="program"){store.program=b.dataset.p; applyProgram(); state.dateISO=todayISO(); state.railBase=null; state.editDay=null; save(); return render();}
  if(a==="emphasis"){store.emphasis=b.dataset.e; applyProgram(); save(); return render();}
  if(a==="location"){store.location=b.dataset.loc; store.gear=Object.assign({},b.dataset.loc==="gym"?GEAR_GYM:GEAR_HOME); applyProgram(); save(); return render();}
  if(a==="wiznext"){state.wizStep=Math.min(WIZ_STEPS-1,(state.wizStep||0)+1);window.scrollTo(0,0);return render();}
  if(a==="wizback"){state.wizStep=Math.max(0,(state.wizStep||0)-1);window.scrollTo(0,0);return render();}
  if(a==="wizdone"){store.setupDone=true;state.wizStep=0;state.tab="home";state.gearOpen={};
    save();applyProgram();applyTheme();window.scrollTo(0,0);return render();}
  if(a==="restoretoggle"){state.showRestore=!state.showRestore;state.expMsg=null;return render();}
  if(a==="export"){Promise.resolve().then(()=>navigator.clipboard.writeText(JSON.stringify(store)))
    .then(()=>{state.expMsg="ok";render();}).catch(()=>{state.expMsg="fail";render();});return;}
  if(a==="erase"){
    if(!state.armErase){state.armErase=true; if(_eraseTimer)clearTimeout(_eraseTimer); _eraseTimer=setTimeout(()=>{state.armErase=false;render();},4000); return render();}
    state.armErase=false; if(_eraseTimer)clearTimeout(_eraseTimer);
    store={bodyweight:store.bodyweight,theme:store.theme,palette:store.palette,level:store.level,skillDays:store.skillDays,skillSteps:store.skillSteps,exLevels:store.exLevels,overrides:{},anim:store.anim,program:store.program,location:store.location,gear:store.gear,emphasis:store.emphasis,schedule:store.schedule,logProgram:{},setupDone:store.setupDone,restSec:store.restSec,restBeep:store.restBeep,logs:{}};
    save(); return render();}
  if(a==="schedule"){store.schedule=b.dataset.s; applyProgram(); save(); return render();}
  if(a==="gearcat"){const c=b.dataset.c; if(!state.gearOpen)state.gearOpen={}; state.gearOpen[c]=!state.gearOpen[c]; return render();}
  if(a==="gear"){const g=b.dataset.g; if(!store.gear)store.gear={}; store.gear[g]=!store.gear[g]; applyProgram(); save(); return render();}
  if(a==="toggleskill"){state.openSkill=state.openSkill===b.dataset.id?null:b.dataset.id;return render();}
  if(a==="level"){store.level=b.dataset.l;save();return render();}
  if(a==="theme"){store.theme=b.dataset.t;save();applyTheme();return render();}
  if(a==="palette"){store.palette=b.dataset.p;save();applyTheme();return render();}
  if(a==="restsec"){store.restSec=parseInt(b.dataset.v,10)||0;if(!store.restSec)restStop();save();return render();}
  if(a==="restbeep"){store.restBeep=b.dataset.v!=="off";if(store.restBeep===false)cancelBeeps();save();return render();}
  if(a==="anim"){store.anim=b.dataset.v!=="off";save();applyTheme();return render();}
});
app.addEventListener("change",e=>{
  const nm=e.target.closest('input[data-a="mname"]');
  if(nm){const ov=store.overrides[state.dateISO];const it=ov&&ov.items&&ov.items.find(x=>x.key===nm.dataset.key);if(it){it.name=nm.value;save();}return;}
  const inp=e.target.closest("input[data-id]");if(!inp)return;stampProgram(state.dateISO);

});
