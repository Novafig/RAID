const WTYPES=['s1','s2','core','l1','l2'];
function assignWeek(on){
 const ord=on.slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
 const types=WTYPES.slice(0,ord.length);
 const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).map(r=>[x].concat(r)));
 const cls=t=>t[0]==='s'?'S':t[0]==='l'?'L':'C';
 let best=null,bs=1e9;
 perms(types).forEach(pm=>{
  const at={};pm.forEach((t,i)=>{at[ord[i]]=t;});
  let sc=0;
  ord.forEach(dw=>{
   const nx=at[(dw+1)%7],c=cls(at[dw]);
   if(nx){const k=c+cls(nx);if(k==='SS')sc+=10;else if(k==='LL')sc+=8;else if(k==='LC'||k==='CL')sc+=2;}
   if(c==='S'&&!at[(dw+6)%7])sc-=0.5;
  });
  const ix=t=>pm.indexOf(t);
  if(ix('s2')<ix('s1'))sc+=1;
  if(ix('l2')>=0&&ix('l2')<ix('l1'))sc+=1;
  if(sc<bs){bs=sc;best=at;}
 });
 const D={s1:-1,s2:-1,core:-1,l1:-1,l2:-1};
 Object.keys(best).forEach(dw=>{D[best[dw]]=+dw;});
 return D;
}
function onFromDays(){const D=S.set.days;return ['s1','s2','core','l1','l2'].filter(k=>k[0]!=='l'||S.set.week===5||(S.set.week===4&&k==='l1')).map(k=>D[k]).filter(x=>x>=0);}
function planBase(d,ak){
 ak=ak||d;
 const dow=pd(d).getDay(),D=S.set.days;
 if(dow===D.core)return{t:'core',dow};
 if(D.l1>=0&&dow===D.l1)return{t:'leg',n:D.l2>=0?1:legAlt(d),dow,arm:!!(S.logs[ak]&&S.logs[ak].alt==='arm')};
 if(D.l2>=0&&dow===D.l2)return{t:'leg',n:2,dow,arm:!!(S.logs[ak]&&S.logs[ak].alt==='arm')};
 if(dow===D.s1)return{t:'skill',role:'s1',skills:dayPlan('s1'),dow};
 if(dow===D.s2)return{t:'skill',role:'s2',skills:dayPlan('s2'),dow};
 return{t:'rest',dow};
}
function planFor(d){
 const mv=S.moves||{};
 const src=Object.keys(mv).find(k=>mv[k]===d&&planBase(k).t!=='rest');
 if(src)return Object.assign({},planBase(src,d),{movedFrom:src,dow:pd(d).getDay()});
 if(mv[d]&&planBase(d).t!=='rest')return{t:'rest',dow:pd(d).getDay(),movedTo:mv[d]};
 return planBase(d);

function realProgress(L){
 if(!L)return false;
 if(L.done||(L.core||0)>0)return true;
 if(Object.values(L.w||{}).some(Boolean)||Object.values(L.m||{}).some(Boolean))return true;
 return Object.values(L.ex||{}).some(E=>E&&((E.s||[]).some(x=>x&&x.done)||(E.att||0)>0||E.landed));
}

function pruneMoves(){
 const mv=S.moves||(S.moves={});let removed=0,ch=true;
 while(ch){ch=false;
  for(const src of Object.keys(mv)){
   const dst=mv[src];
   if(dst<today()||hasProgress(dst))continue;
   let bad=planBase(src).t==='rest';
   if(!bad&&planBase(dst).t!=='rest'&&!(mv[dst]&&mv[dst]!==dst))bad=true;
   if(bad){delete mv[src];removed++;ch=true;}
  }
 }
 S.mvg=S.mvg||{};Object.keys(S.mvg).forEach(k=>{if(!mv[k])delete S.mvg[k];});

function pushPlan(d){
 const t=addD(d,1),chain=[];let c=t;
 for(let i=0;i<7&&planFor(c).t!=='rest';i++){chain.push(c);c=addD(c,1);}

function pullPlan(d){
 const t=addD(d,-1),lim=addD(today(),-45),chain=[];let c=t;

 }

/* ===== log helpers ===== */
function entries(key){
 return Object.keys(S.logs).sort().map(d=>({d,E:S.logs[d].ex&&S.logs[d].ex[key]})).filter(x=>x.E&&x.E.s&&x.E.s.some(s=>s.done||s.v!=null));
}
function lastBefore(key,d,step){const a=entries(key).filter(x=>x.d<d&&x.E.st===step);return a.length?a[a.length-1]:null;}
const hasV=s=>!!s&&s.v!=null&&s.v!==''&&!isNaN(+s.v);
const isSkipSet=s=>!!s&&!!s.done&&!hasV(s);
const hasVals=E=>!!E&&(E.s||[]).some(hasV);
const bestOf=E=>Math.max(0,...E.s.map(s=>hasV(s)?+s.v:0));
function hist(g){
 const st=curStep(g);
 return entries(g+'.main').filter(x=>x.E.st===st&&hasVals(x.E)).map(x=>bestOf(x.E)).slice(-14);
}
function spark(v){
 if(v.length<2)return'';
 const mx=Math.max(...v),mn=Math.min(...v),rg=mx-mn||1;
 const pts=v.map((y,i)=>(i*(100/(v.length-1))).toFixed(1)+','+(26-((y-mn)/rg)*22).toFixed(1)).join(' ');
 return'<svg viewBox="0 0 100 28" width="120" height="30" style="display:block"><polyline points="'+pts+'" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/></svg>';
}
function hint(g){
 const r=SK[g]&&SK[g].rows.find(x=>x.main);
 if(!r||!r.top||curStep(g)>=stepsOf(g).length)return'';
 const a=entries(g+'.main').filter(x=>x.E.st===curStep(g));
 if(!a.length)return'';
 const E=a[a.length-1].E,done=E.s.filter(s=>s.done&&hasV(s));
 if(done.length>=r.minR&&done.every(s=>+s.v>=r.top))return'Top of the guide\u2019s range hit on every round last session ('+r.dose+'). If it feels easy, move up a step \u2014 progressive overload means the next step, not more of the same.';
 return'';
}
function stallCheck(g){
 const e=entries(g+'.main').filter(x=>x.E.st===curStep(g)&&hasVals(x.E));
 const t=today(),a=addD(t,-14),b=addD(t,-28);
 const r1=e.filter(x=>x.d>a),r0=e.filter(x=>x.d>b&&x.d<=a);
 if(r1.length>=3&&r0.length>=1){
  const m1=Math.max(...r1.map(x=>bestOf(x.E))),m0=Math.max(...r0.map(x=>bestOf(x.E)));
  if(m1<=m0)return true;
 }
 return false;
}

}

function guideNotes(){
 return'<h3>Intro</h3><p class="small">'+link('https://youtube.com/shorts/qfwZBZ3J5J4?is=Pcmky8QbHGh2NzEk','Author\u2019s intro-to-the-skills video')+'</p><p class="small">Seven skills: frog stand, crow stand, elbow lever, pistol squat, headstand, handstand, L-sit. Two take longer for different reasons: handstand is a balance problem, L-sit a compression problem. Three days a week: two skill days, one mobility + core day. Calisthenics overload = more reps or a harder variation, not more weight.</p>'+
 '<h3>Mindset (Ch.6)</h3><p class="small">Pushing hard enough vs too hard. Going to failure on every set hurts later sets, total volume, technique practice and injury risk (Isaac Lee, quoted). Handstand starting point depends on your balance and build \u2014 bottom-heavy bodies need more reps, not more effort. Keep doing scapular push-ups and wall work regardless. Train skills 2\u20133 times a week.</p>'+
 '<h3>How to learn any skill (Ch.15)</h3><p class="small">Break it into a static hold, a dynamic version, and a supporting strength move. Example: tuck planche = tuck planche hold, tuck planche lean, pseudo push-up. Spend most effort on the current progression, keep supporting work a bit lighter, and rotate in the dynamic version when the static hold stalls.</p>'+
 '<h3>Compression (Ch.16)</h3><p class="small">Folding against gravity with hips bent and core braced. Needs flexibility, strength and control together \u2014 hence slow. Train all three: hip flexor/hamstring flexibility, direct compression strength (hollow hold), and the skill itself. Related: elbow lever, V-sit, manna, straddle work.</p>'+
 '<h3>Progressive overload (Ch.17)</h3><p class="small">When the recommended reps feel too easy, move to the next step. At the top of a ladder add reps. Once reps are solid, add weight (weighted vest, or a plate between your feet for dips). Weight comes last.</p>'+
 '<h3>Starting a session (Ch.19)</h3><p class="small">Warmup (5\u201310 min) \u2192 foundational push/pull/dip at your current step \u2192 skill practice from that skill\u2019s sample workout. Usually 30\u201345 minutes. Groove touches are separate.</p>'+
 '<h3>FAQ highlights (Ch.22)</h3><p class="small">First clean hold (usually frog) within 2\u20134 weeks. Handstand and L-sit can each take most of a year. Cannot do a push-up yet? Start with the regressions. Skill not clicking? Go back to earlier steps instead of repeating failed attempts.</p>'+
 '<h3>Helpful info (Ch.23)</h3><p class="small">Film yourself. Track hold times and reps (this app does). Expect 2\u20133 week plateaus. The author is building a higher-frequency follow-up program.</p>'+
 '<h3>Equipment (Ch.2)</h3><p class="small">Parallettes (cheap wooden/PVC is fine), a doorframe pull-up bar, a light and a medium resistance band, a yoga mat for headstand/head-loaded holds, optional wrist wraps.</p>';
}
function flagNotes(){
 return'<ul class="small"><li>Foundation intensity: the Quick Reference says \u201cnear-max reps\u201d and \u201cto failure\u201d, but Ch.6 quotes Isaac Lee that failing every set is a mistake and says the same applies at beginner level. The app shows the guide\u2019s numbers and flags the conflict.</li><li>Stage 2\u2019s example trains each skill once a week; Ch.20 says twice a week beats once. There is a setting for it.</li><li>\u201cPike hold\u201d means two different things: seated V in the core circuit, inverted V on the handstand ladder.</li><li>Handstand step 6 (scapular push-ups) is also a do-from-day-one move, so that ladder is not strictly sequential.</li><li>No rest times are given for foundation work, handstand, pistol, drills, or \u201cneck and shoulder prep\u201d (not defined). The app uses your default rest and says so.</li><li>The guide prescribes only the core circuit for the mobility day; other mobility items come from mentions in other chapters.</li><li>The guide has no legs, arms or abs work. The lower-body A/B days, the arms A/B swap and the abs block (moves follow your equipment ticks: pull-up bar or Swedish ladder, dip station, Roman chair) are my addition, written for 15 lb and 35 lb dumbbells, a pull-up bar and a Roman chair, so check the loads and the chair setups. Warmups on those days are matched to the day\u2019s work; the guide\u2019s wrist/shoulder warmup shrinks to a two-item prep row inside Foundation on leg days. The guide also runs foundation work only on skill days; here it runs on all five training days at your request.</li><li>Equipment alternatives (farmer hold or band pull-aparts instead of bar work, inverted rows, floor-based leg moves, planks without a Roman chair) are my substitutions, not the guide\u2019s.</li><li>The guide has no walking. The optional walk tracker is my addition, off by default.</li><li>\u201cSolid\u201d (when to unlock the next skill) is not defined in numbers. You mark it yourself; the app only suggests moving up when you hit the top of the sample-workout range on every round.</li></ul>';
}

/* ===== audio + rest ===== */
let AC=null;
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d){
 if(!S.set.sound||!AC)return;
 try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
 try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}
}
let rest=null;
function startRest(sec){ensureAudio();rest={end:Date.now()+sec*1000,last:-1};updRest();}
function updRest(){
 const el=$('#restbar');
 if(!rest){el.style.display='none';return;}
 const left=Math.ceil((rest.end-Date.now())/1000);
 if(left<=0){beep(880,.5);rest=null;el.style.display='none';return;}
 if(left<=3&&left!==rest.last){rest.last=left;beep(520,.08);}
 el.style.display='flex';
 el.innerHTML='<span>Rest '+Math.floor(left/60)+':'+pad(left%60)+'</span><span><button class="sm" data-a="radd">+30s</button> <button class="sm" data-a="rskip">Skip</button></span>';
}
setInterval(updRest,250);

/* ===== actions ===== */
function ex(d,g,r,step){
 const L=wlog(d),k=g+'.'+r;
 const E=L.ex[k]||(L.ex[k]={st:step,s:[]});
 E.st=step;return E;
}
function advance(g,n){
 const old=curStep(g),prev=JSON.stringify(S.prog[g]);
 const nw=Math.min(Math.max(old+n,1),stepsOf(g).length);
 if(nw===old)return;
 S.prog[g].step=nw;if(nw<stepsOf(g).length)S.prog[g].solid=false;
 save();render();
 toast(nameOf(g)+': step '+nw+' \u2014 '+stepsOf(g)[nw-1][0],()=>{S.prog[g]=JSON.parse(prev);save();render();});
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a;
 if(['val','setday','weekmode','pistol','legday','st2','restdef','walkgoal','sstep','note'].includes(a))return;
 const g=t.dataset.g,n=+t.dataset.n;
 switch(a){

  case'mchk':{const prev=snapDone();const L=wlog(ui.date);L.m[t.dataset.k]=!L.m[t.dataset.k];save();render();advanceFrom(prev);break;}
  case'ck':{
   const prev=snapDone();
   const E=ex(ui.date,g,t.dataset.r,+t.dataset.st),i=+t.dataset.i;
   while(E.s.length<=i)E.s.push({v:null,done:false});
   E.s[i].done=!E.s[i].done;
   const inp=t.parentElement.querySelector('input');if(inp&&inp.value!=='')E.s[i].v=parseFloat(inp.value);
   save();render();advanceFrom(prev);
   if(E.s[i].done&&(!inp||hasV(E.s[i])))startRest(+t.dataset.rest);
   break;}
  case'addr':{const E=ex(ui.date,g,t.dataset.r,+t.dataset.st);const r=(g in FOUND||g==='chin')?{r:[3,4]}:g==='ext'?extRow(t.dataset.r):SK[g].rows.find(x=>x.id===t.dataset.r);const want=Math.min(r.r[1],Math.max(r.r[0],E.s.length+1));while(E.s.length<want)E.s.push({v:null,done:false});save();render();break;}
  case'subr':{const L=wlog(ui.date),E=L.ex[g+'.'+t.dataset.r];if(E&&E.s.length){E.s.pop();save();render();}break;}
  case'natt':{const L=wlog(ui.date),E=L.ex[g+'.next']||(L.ex[g+'.next']={st:curStep(g),att:0,s:[]});const mx=(SK[g]&&SK[g].nextMax)||5;E.att=Math.min(mx,Math.max(0,(E.att||0)+n));save();render();break;}

  case'step':advance(g,n);break;
  case'setstep':{const prev=JSON.stringify(S.prog[g]);S.prog[g].step=+t.dataset.i;S.prog[g].solid=false;save();render();toast(nameOf(g)+': current step set',()=>{S.prog[g]=JSON.parse(prev);save();render();});break;}
  case'solid':S.prog[g].solid=!S.prog[g].solid;save();render();
   if(S.prog[g].solid&&g==='frog')toast('Frog marked solid \u2014 Crow Stand is now your Stage 1 focus.');
   break;
  case'chinon':S.prog.chin.on=!S.prog.chin.on;save();render();break;
  case'stage':{const prev=S.set.stage;S.set.stage=n;save();render();toast('Stage '+n+' active',()=>{S.set.stage=prev;save();render();});break;}
  case'mvfwd':{const d=ui.date,pp=pushPlan(d);if(!pp||hasProgress(d)||planFor(d).t==='rest')break;
   const snap=JSON.stringify([S.moves,S.mvg]),srcOf=x=>planFor(x).movedFrom||x;
   const pairs=[[srcOf(d),pp.t]].concat(pp.chain.map(c=>[srcOf(c),addD(c,1)])),gid='g'+Date.now();
   pairs.forEach(x=>{S.moves[x[0]]=x[1];S.mvg[x[0]]=gid;});
   save();render();
   toast('Workout moved to '+(pp.t===today()?'today':DOWL[pd(pp.t).getDay()])+(pp.chain.length?' and the days after it shifted':''),()=>{const o=JSON.parse(snap);S.moves=o[0];S.mvg=o[1];save();render();});break;}
  case'nohave':{const k=t.dataset.k;S.sub[k]=true;save();render();toast('Swapped for an alternative',()=>{delete S.sub[k];save();render();});break;}
  case'havenow':delete S.sub[t.dataset.k];save();render();break;
  case'mvbk':{const d=ui.date,pp=pullPlan(d);if(!pp||hasProgress(d)||planFor(d).t==='rest')break;
   const snap=JSON.stringify([S.moves,S.mvg]),srcOf=x=>planFor(x).movedFrom||x;
   const pairs=[[srcOf(d),pp.t]].concat(pp.chain.map(c=>[srcOf(c),addD(c,-1)])),gid='g'+Date.now();
   pairs.forEach(x=>{S.moves[x[0]]=x[1];S.mvg[x[0]]=gid;});
   save();render();
   toast('Workout pulled to '+DOWL[pd(pp.t).getDay()]+(pp.chain.length?' and the days before it shifted':''),()=>{const o=JSON.parse(snap);S.moves=o[0];S.mvg=o[1];save();render();});break;}

   const d=ui.date,old=S.logs[d]?JSON.stringify(S.logs[d]):null,o=S.logs[d]||{};

   save();render();
   toast('Day reset. Your note and Legs/Arms choice were kept.',()=>{if(old)S.logs[d]=JSON.parse(old);else delete S.logs[d];save();render();});break;}
  case'pause':{const L=wlog(today()),lr=lastReal(ensureSeg(L));if(lr&&lr[1]==null&&!L.done){lr[1]=Date.now();sync(L);save();render();}break;}
  case'resume':{const L=wlog(today());if(L.done)break;delete L.stopped;const sg=ensureSeg(L),lr=lastReal(sg);if(!lr||lr[1]!=null){L.seg=sg.filter(x=>x[0]!=null||x[1]!=null);L.seg.push([Date.now(),null]);sync(L);save();render();}break;}
  case'fadd':{const L=wlog(ui.date),sg=ensureSeg(L),lt=sg[sg.length-1];if(!lt||lt[0]!=null||lt[1]!=null){sg.push([null,null]);save();render();}break;}
  case'fdel':{const L=wlog(ui.date),sg=ensureSeg(L),i=+t.dataset.i,x=sg[i];if(x&&!(x[0]!=null&&x[1]==null&&!L.done&&ui.date===today())){sg.splice(i,1);sync(L);save();render();}break;}
  case'walk':{const L=wlog(ui.date);L.walk=Math.max(0,(L.walk||0)+n);save();render();break;}
  case'gtg':{const L=wlog(ui.date);L.gtg.push({k:t.dataset.k,t:Date.now()});save();render();break;}
  case'gundo':{const L=wlog(ui.date);L.gtg.pop();save();render();break;}
  case'pal':S.set.palette=t.dataset.p;save();applyTheme();if($('#sheet').style.display==='block')showSetup();else render();break;
  case'tgl':S.set[t.dataset.k]=!S.set[t.dataset.k];save();render();break;
  case'eq':S.set.eq[t.dataset.k]=!(S.set.eq[t.dataset.k]===true);save();if(t.dataset.s)showSetup();else render();break;
  case'cgo':cgo();break;
  case'cskip':if(circ.ph==='work'||circ.ph==='rest'){circ.end=Date.now();circTick();}break;
  case'creset':circ.ph='idle';circ.idx=0;circ.round=1;circUpd();break;
  case'cround':{const prev=snapDone();const L=wlog(ui.date);L.core=Math.min(2,Math.max(0,(L.core||0)+n));save();render();advanceFrom(prev);break;}
  case'radd':if(rest)rest.end+=30000;updRest();break;
  case'rskip':rest=null;updRest();break;
  case'undo':if(ui.toast){ui.toast();$('#toast').style.display='none';ui.toast=null;}break;
  case'setup':showSetup();break;
  case'sstage':S.set.stage=n;save();showSetup();break;
  case'sdone':S.setup=true;save();$('#sheet').style.display='none';render();break;
  case'bkcopy':{const x=$('#bk');x.select();try{navigator.clipboard.writeText(x.value);}catch(err){document.execCommand('copy');}S.lastBk=Date.now();save();toast('Backup copied');break;}
  case'bkfile':{
   const txt=JSON.stringify(S),name='ascent-backup-'+today()+'.json';
   const ok=()=>{S.lastBk=Date.now();save();render();toast('Backup saved');};
   const dl=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);ok();}catch(err){toast('Could not save the file — use Copy / paste instead');}};
   let f=null;try{f=new File([txt],name,{type:'application/json'});}catch(err){}
   if(f&&navigator.canShare&&navigator.share&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Ascent backup'}).then(ok).catch(err=>{if(!err||err.name!=='AbortError')dl();});}
   else dl();
   break;}
  case'bkrep':{if(!ui.pendImp)break;S=ui.pendImp.o;ui.pendImp=null;load2();save();render();toast('Backup restored');break;}
  case'bkcan':ui.pendImp=null;render();break;
  case'bkgo':ui.tab='more';ui.open['m_bk']=true;render();setTimeout(()=>scrollToEl(document.querySelector('[data-card="m_bk"]')),50);break;
  case'bklater':S.bkSnooze=Date.now()+3*864e5;save();render();break;
  case'bkimp':{try{const o=JSON.parse($('#bki').value);if(!o||!o.set||!o.prog)throw 0;S=o;load2();save();render();toast('Backup imported');}catch(err){toast('That is not a valid backup');}break;}
  case'reset':
   if(t.dataset.arm){S=defState();load2();save();location.reload();}
   else{t.dataset.arm='1';t.textContent='Tap again to erase everything';setTimeout(()=>{t.dataset.arm='';t.textContent='Reset all data';},4000);}
   break;
 }
});
function load2(){const d=defState();S.set=Object.assign({},d.set,S.set||{});S.set.days=Object.assign({},d.set.days,S.set.days||{});S.set.eq=S.set.eq||{};if(!Array.isArray(S.set.on)){S.set.on=onFromDays();if(S.set.week===3){S.set.days.l1=-1;S.set.days.l2=-1;}}S.logs=S.logs||{};S.chk=S.chk||{};S.prog=S.prog||{};S.moves=S.moves||{};S.mvg=S.mvg||{};S.sub=S.sub||{};GROUPS.forEach(k=>{if(!S.prog[k])S.prog[k]={step:1,solid:false};});}
document.addEventListener('change',e=>{
 const t=e.target;if(!t.dataset||!t.dataset.a)return;
 const a=t.dataset.a;
 if(a==='val'){
  const E=ex(ui.date,t.dataset.g,t.dataset.r,+t.dataset.st),i=+t.dataset.i;
  while(E.s.length<=i)E.s.push({v:null,done:false});
  E.s[i].v=t.value===''?null:parseFloat(t.value);save();
 }else if(a==='fs'||a==='fe'){
  const L=wlog(ui.date),sg=ensureSeg(L),i=+t.dataset.i,k=a==='fs'?0:1;
  while(sg.length<=i)sg.push([null,null]);
  if(!t.value)sg[i][k]=null;
  else{const hm=t.value.split(':'),x=pd(ui.date);x.setHours(+hm[0],+hm[1],0,0);let ms=x.getTime();
   if(k===1&&sg[i][0]!=null&&ms<sg[i][0])ms+=864e5;
   if(k===0&&sg[i][1]!=null&&sg[i][1]<ms)sg[i][1]+=864e5;
   sg[i][k]=ms;}
  sync(L);save();render();
 }else if(a==='bkfin'){
  const f=t.files&&t.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!o.set||!o.prog)throw 0;ui.pendImp={o,name:f.name};render();}catch(err){toast('That file is not an Ascent backup');}};
  rd.readAsText(f);
 }else if(a==='note'){wlog(ui.date).note=t.value;save();}
 else if(a==='setday'){
  const r=t.dataset.r,nv=+t.value,D=S.set.days,old=D[r];
  Object.keys(D).forEach(k=>{if(k!==r&&D[k]===nv)D[k]=old;});
  D[r]=nv;const rm=pruneMoves();save();if($('#sheet').style.display==='block')showSetup();else render();if(rm)toast('Moved workouts that no longer fit were put back');
 }
 else if(a==='weekmode'){S.set.week=+t.value;const rm=pruneMoves();save();if($('#sheet').style.display==='block')showSetup();else render();if(rm)toast('Moved workouts that no longer fit were put back');}
 else if(a==='pistol'){S.set.pistol=t.value;save();render();}
 else if(a==='legday'){S.set.leg=+t.value;save();render();}
 else if(a==='st2'){S.set.st2=t.value;save();render();}
 else if(a==='restdef'){S.set.rest=Math.max(10,parseInt(t.value)||120);save();}
 else if(a==='walkgoal'){S.set.walkGoal=Math.max(5,parseInt(t.value)||30);save();}
 else if(a==='sstep'){S.prog[t.dataset.g].step=+t.value;save();}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ui.date=ui.date;}});

/* ===== themes ===== */
const PAL=[['azure','Azure','#2E93FF','#0A1018'],['cyan','Cyan','#22D3EE','#08131A'],['violet','Violet','#A78BFA','#0E0B16'],['rose','Rose','#FB7185','#150B10'],['amber','Amber','#E8A13C','#14110F'],['graphite','Graphite','#E4E4E7','#0E0E10']];
function palInfo(){return PAL.find(x=>x[0]===S.set.palette)||PAL[0];}
function palChips(){return'<div class="pals">'+PAL.map(p=>'<button class="pal'+(S.set.palette===p[0]?' on':'')+'" data-a="pal" data-p="'+p[0]+'"><i style="background:'+p[2]+'"></i>'+p[1]+'</button>').join('')+'</div>';}
function drawIcon(){
 try{
  const pi=palInfo(),c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle=pi[3];x.fillRect(0,0,180,180);x.strokeStyle=pi[2];x.lineWidth=16;x.lineCap='round';x.lineJoin='round';
  x.beginPath();x.moveTo(40,115);x.lineTo(90,65);x.lineTo(140,115);x.stroke();
  x.globalAlpha=.5;x.beginPath();x.moveTo(40,150);x.lineTo(90,100);x.lineTo(140,150);x.stroke();
  $('#ico').href=c.toDataURL('image/png');
 }catch(e){}
}
function applyTheme(){
 const pi=palInfo();
 if(pi[0]==='azure')document.documentElement.removeAttribute('data-palette');else document.documentElement.setAttribute('data-palette',pi[0]);
 try{document.querySelector('meta[name="theme-color"]').setAttribute('content',pi[3]);}catch(e){}
 drawIcon();
}
/* ===== init ===== */
load();pruneMoves();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
applyTheme();
render();
if(!S.setup)showSetup();
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl){window.__rl=1;location.reload();}});navigator.serviceWorker.register('sw.js');}}catch(e){}
</script>
